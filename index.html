<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sooca Coffee — Indonesian Green Coffee Supplier</title>
    <meta name="description" content="Sooca Coffee supplies traceable green coffee beans from across the Indonesian archipelago. Diverse origins, consistent grading, export ready." />

    <!-- Google Fonts preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <style>
      /* Skip link — accessible, hidden until focused */
      .skip-link {
        position: fixed;
        top: -100%;
        left: 16px;
        z-index: 9999;
        background: #5F422F;
        color: #fff;
        padding: 12px 20px;
        border-radius: 8px;
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
        transition: top 0.2s ease;
      }
      .skip-link:focus {
        top: 16px;
      }
    </style>
  </head>

  </body>
